<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>London Eco-Rider: Ice Cream & Bottle Patrol</title>
    <meta name="description" content="A fast-paced Mario-inspired 2D platformer set in London downtown. Ride your bike, collect ice cream cones, and recycle plastic bottles!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 1rem;
            color: #94a3b8;
        }

        .game-wrapper {
            position: relative;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.25);
            width: 100%;
            max-width: 960px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Ebitengine canvas styling */
        canvas {
            display: block !important;
            margin: 0 auto !important;
            border-radius: 12px;
            width: 100% !important;
            max-width: 936px !important;
            height: auto !important;
            aspect-ratio: 16 / 9;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .controls-card {
            margin-top: 16px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 960px;
            width: 100%;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .key {
            background: #334155;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 4px 10px;
            font-weight: 600;
            color: #f1f5f9;
            font-size: 0.85rem;
            box-shadow: 0 2px 0 #1e293b;
        }

        footer {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
    <script src="wasm_exec.js"></script>
    <script>
        if (!WebAssembly.instantiateStreaming) {
            WebAssembly.instantiateStreaming = async (resp, importObject) => {
                const source = await (await resp).arrayBuffer();
                return await WebAssembly.instantiate(source, importObject);
            };
        }

        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject).then((result) => {
            go.run(result.instance);
            // Move canvas inside .game-wrapper container if attached to body
            const wrapper = document.getElementById("game-wrapper");
            const canvas = document.querySelector("canvas");
            if (wrapper && canvas && canvas.parentElement !== wrapper) {
                wrapper.appendChild(canvas);
            }
        }).catch((err) => {
            console.error("WASM load failed:", err);
        });
    </script>
</head>
<body>
    <header>
        <h1>🚴 London Eco-Rider</h1>
        <p class="subtitle">Ice Cream & Plastic Bottle Patrol in Downtown London</p>
    </header>

    <main class="game-wrapper" id="game-wrapper">
        <!-- Ebitengine WASM Canvas renders inside wrapper -->
    </main>

    <div class="controls-card">
        <div class="control-group">
            <span class="key">A</span> / <span class="key">D</span> or <span class="key">←</span> / <span class="key">→</span>
            <span>Move / Pedal</span>
        </div>
        <div class="control-group">
            <span class="key">Space</span> / <span class="key">E</span> / <span class="key">Enter</span>
            <span>Dump Bottles / Jump</span>
        </div>
        <div class="control-group">
            <span class="key">Shift</span> / <span class="key">J</span>
            <span>Turbo Boost</span>
        </div>
        <div class="control-group">
            <span class="key">F11</span>
            <span>Fullscreen</span>
        </div>
    </div>

    <footer>
        <p>Built with Go 1.26, Ebitengine v2 & Gemini AI Assets</p>
    </footer>
</body>
</html>
